{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 4rem auto; padding: 0 1rem;">
    <div class="glass-panel" style="padding: 2.5rem; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-glass); box-shadow: var(--shadow-glass);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', path='logo.png') }}" alt="MASARI Logo" style="height: 40px; width: auto; object-fit: contain;">
        </div>
        <h2 style="text-align: center; color: var(--primary); font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem;">New Password</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">Please enter a secure new password for your account. It must be at least 6 characters long.</p>
        
        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
            <div style="margin-bottom: 1.25rem;">
                <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">New Password</label>
                <input type="password" id="password" name="password" required class="search-input" placeholder="••••••••" style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 1.75rem;">
                <label for="confirm_password" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="search-input" placeholder="••••••••" style="width: 100%;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700; border-radius: 10px;">Set New Password</button>
        </form>
    </div>
</div>
{% endblock %}
