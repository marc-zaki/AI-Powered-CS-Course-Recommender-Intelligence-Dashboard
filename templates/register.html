{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 4rem auto;">
    <div class="glass-panel" style="padding: 2.5rem; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-glass);">
        <h2 style="text-align: center; color: var(--primary); font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem;">Create an Account</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Join us to get personalized course recommendations and build your intelligence dashboard.</p>
        
        <form action="{{ url_for('register') }}" method="POST">
            <div style="margin-bottom: 1.25rem;">
                <label for="name" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Full Name</label>
                <input type="text" id="name" name="name" required class="search-input" style="width: 100%;" placeholder="John Doe">
            </div>
            
            <div style="margin-bottom: 1.25rem;">
                <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Email Address</label>
                <input type="email" id="email" name="email" required class="search-input" style="width: 100%;" placeholder="you@example.com">
            </div>
            
            <div style="margin-bottom: 1.25rem;">
                <label for="password" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Password</label>
                <input type="password" id="password" name="password" required class="search-input" style="width: 100%;" placeholder="••••••••">
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label for="track" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Preferred Track</label>
                <select id="track" name="track" class="search-input" style="width: 100%; background-color: var(--bg-card); color: var(--text-main);">
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Data Science">Data Science</option>
                    <option value="Cybersecurity">Cybersecurity</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="General CS">General Computer Science</option>
                </select>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <label for="skill_level" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Current Skill Level</label>
                <select id="skill_level" name="skill_level" class="search-input" style="width: 100%; background-color: var(--bg-card); color: var(--text-main);">
                    <option value="Beginner">Beginner (Little to no experience)</option>
                    <option value="Intermediate">Intermediate (Some programming knowledge)</option>
                    <option value="Advanced">Advanced (Experienced developer)</option>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="career_goals" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Career Goals</label>
                <textarea id="career_goals" name="career_goals" class="search-input" style="width: 100%; min-height: 80px; resize: vertical;" placeholder="E.g., I want to become a machine learning engineer at a top tech company..."></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">Create Account</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Already have an account? <a href="{{ url_for('login') }}" style="color: var(--secondary); font-weight: 600; text-decoration: none;">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
