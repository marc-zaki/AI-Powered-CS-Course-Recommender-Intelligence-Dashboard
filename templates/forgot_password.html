{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 500px; margin: 4rem auto; padding: 0 1rem;">
    <div class="glass-panel" style="padding: 2.5rem; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-glass); box-shadow: var(--shadow-glass);">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="MASARI Logo" style="height: 40px; width: auto; object-fit: contain;">
        </div>
        <h2 style="text-align: center; color: var(--primary); font-weight: 800; font-size: 2rem; margin-bottom: 0.5rem;">Reset Password</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">Enter the email address associated with your account and we will send you a password reset link.</p>
        
        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div style="margin-bottom: 1.5rem;">
                <label for="email" style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main);">Email Address</label>
                <input type="email" id="email" name="email" required class="search-input" placeholder="you@example.com" style="width: 100%;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; font-weight: 700; border-radius: 10px;">Send Reset Link</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Remember your password? <a href="{{ url_for('login') }}" style="color: var(--secondary); font-weight: 600; text-decoration: none;" onmouseenter="this.style.textDecoration='underline'" onmouseleave="this.style.textDecoration='none'">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
