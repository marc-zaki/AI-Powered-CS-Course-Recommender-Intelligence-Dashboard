{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 3rem auto;">
    <div class="glass-panel" style="padding: 2.5rem; background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border-glass);">
        <h2 style="text-align: center; color: var(--primary); font-weight: 800; font-size: 2.25rem; margin-bottom: 0.5rem;">One Last Step...</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem;">Help us tune your AI recommendations by rating your familiarity and interest in these 5 random topics.</p>
        
        <form action="{{ url_for('onboarding') }}" method="POST">
            {% for course in courses %}
            <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;">
                <h3 style="color: var(--text-main); font-weight: 700; margin-bottom: 0.25rem;">{{ course.title }}</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">{{ course.provider }}</p>
                
                <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); font-size: 0.9rem;">How interested are you in this?</label>
                        <select name="course_{{ course.temp_id }}_interest" class="search-input" style="width: 100%; padding: 0.5rem; background-color: var(--bg-card); color: var(--text-main);">
                            <option value="Not Interested">Not Interested</option>
                            <option value="Somewhat Interested">Somewhat Interested</option>
                            <option value="Very Interested" selected>Very Interested</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 200px;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); font-size: 0.9rem;">Your skill level in this topic?</label>
                        <select name="course_{{ course.temp_id }}_skill" class="search-input" style="width: 100%; padding: 0.5rem; background-color: var(--bg-card); color: var(--text-main);">
                            <option value="None">None</option>
                            <option value="Beginner" selected>Beginner</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Advanced">Advanced</option>
                        </select>
                    </div>
                </div>
            </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; font-weight: 700; background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);">Save & View Dashboard <i data-lucide="sparkles"></i></button>
        </form>
    </div>
</div>
{% endblock %}
